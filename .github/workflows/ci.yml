name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.11-alpine3.23
        env:
          POSTGRES_DB: rewardflow
          POSTGRES_USER: rewardflow
          POSTGRES_PASSWORD: rewardflow_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rewardflow -d rewardflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore RewardFlow.SuppleDesign.slnx

      - name: Build
        run: dotnet build RewardFlow.SuppleDesign.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test RewardFlow.SuppleDesign.slnx --configuration Release --no-build --verbosity normal
